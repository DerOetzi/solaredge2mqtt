name: build-project

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # Keep these branch lists in sync with the `PACKAGE_BRANCHES` repo variable
  # (used below to gate docker publish) -- GitHub Actions `on:` triggers can't
  # reference vars/expressions directly.
  push:
    branches: [main, storedge]
  pull_request:
    branches: [main, storedge]
  release:
    types: [published]

env:
  REGISTRY_GITHUB: ghcr.io

jobs:
  variables:
    outputs:
      ref_name: ${{ steps.var.outputs.ref_name}}
      image_name: ${{ steps.var.outputs.image_name }}
      ghcr_image: ${{ steps.var.outputs.ghcr_image }}
      version: ${{ steps.var.outputs.version }}
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Setting global variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: var
        with:
          script: |
            const refName = '${{ github.ref_name || github.event.release.tag_name }}';
            core.setOutput('ref_name', refName.toLowerCase().replaceAll(/[/.]/g, '-').trim('-'));
            core.setOutput('image_name', '${{ github.repository }}'.toLowerCase());
            core.setOutput('ghcr_image', '${{ env.REGISTRY_GITHUB }}/${{ github.repository }}'.toLowerCase());
            const version = refName.replace(/^v/, '');
            core.setOutput('version', version);

  build-check:
    runs-on: ubuntu-latest
    needs: [variables]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: "3.13"

      - name: Install package with dev dependencies
        run: uv sync --locked --extra dev --extra forecast

      - name: Get changed Python files
        id: changed-py-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}...HEAD" -- '*.py' | tr '\n' ' ')
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMRT "${{ github.event.before }}" "${{ github.sha }}" -- '*.py' | tr '\n' ' ')
          fi
          echo "files=$(echo "$FILES" | xargs)" >> $GITHUB_OUTPUT

      - name: Lint with ruff
        run: |
          FILES="${{ steps.changed-py-files.outputs.files }}"
          uv run ruff check ${FILES:-.}

      - name: Type check with pyright
        run: |
          FILES="${{ steps.changed-py-files.outputs.files }}"
          if [ -z "$FILES" ]; then
            uv run pyright
          else
            uv run pyright $FILES
          fi

      - name: Run tests with coverage
        run: uv run pytest --cov=solaredge2mqtt --cov-report=xml:coverage.xml --tb=short

      - name: Build package
        run: uv build

      - name: Save python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-artifacts-3.13-${{ env.REF_NAME }}
          path: |
            dist

      - name: Publish package to pypi
        if: ${{ github.event_name == 'release' }}
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          packages-dir: dist/

      - name: Publish assets to github
        if: ${{ github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de
        with:
          repo_token: ${{ github.token }}
          file: dist/*
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
          file_glob: true

  build-compat:
    runs-on: ubuntu-latest
    needs: [variables, build-check]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
    permissions:
      contents: read
    strategy:
      matrix:
        python-version:
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: uv sync --locked --extra dev --extra forecast

      - name: Run tests
        run: uv run pytest --tb=short

  build-docker:
    runs-on: ${{ matrix.runner }}
    needs: [variables, build-check]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
      IMAGE_NAME: ${{ needs.variables.outputs.image_name }}
      GHCR_IMAGE: ${{ needs.variables.outputs.ghcr_image }}
      VERSION: ${{ needs.variables.outputs.version }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"

      - name: Generate static solaredge2mqtt/_version.py
        # --system would install setuptools-scm into the runner's own Python,
        # which Ubuntu marks externally-managed (PEP 668) and uv refuses to
        # touch. --with runs freeze_version.py in a throwaway uv-managed
        # environment instead - no system Python involved at all.
        run: uv run --no-project --with 'setuptools-scm[toml]>=8' python freeze_version.py

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to the Docker github container registry
        if: ${{github.event_name == 'release' || (github.event_name == 'push' && contains(fromJSON(vars.PACKAGE_BRANCHES), github.ref_name))}}
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Docker container registry
        if: ${{github.event_name == 'release'}}
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Map platform to tag suffix
        id: archmap
        run: |
          case "${{ matrix.arch }}" in
            amd64)   echo "ARCH_TAG=amd64" >> $GITHUB_ENV ;;
            arm64)   echo "ARCH_TAG=arm64" >> $GITHUB_ENV ;;
          esac

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ github.event_name == 'release' && env.IMAGE_NAME || '' }}
          tags: |
            type=raw,value=latest-${{ env.ARCH_TAG }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ env.VERSION }}-${{ env.ARCH_TAG }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ env.REF_NAME }}-${{ env.ARCH_TAG }},enable=${{ github.event_name != 'release' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{github.event_name == 'release' || (github.event_name == 'push' && contains(fromJSON(vars.PACKAGE_BRANCHES), github.ref_name))}}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.repository }}-${{ env.REF_NAME }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-${{ env.REF_NAME }}-${{ matrix.arch }}

      # merge-manifest combines these per-arch builds by digest, not by the
      # mutable per-arch tags above: two overlapping workflow runs racing to
      # push the same tag (e.g. arm64's longer build time letting an older
      # commit's push land after a newer one's) must never let the older
      # image win the final multi-arch manifest silently. A digest is
      # immutable and always names the exact image this job just built.
      - name: Export digest
        if: ${{github.event_name == 'release' || (github.event_name == 'push' && contains(fromJSON(vars.PACKAGE_BRANCHES), github.ref_name))}}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{github.event_name == 'release' || (github.event_name == 'push' && contains(fromJSON(vars.PACKAGE_BRANCHES), github.ref_name))}}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    runs-on: ubuntu-latest
    needs: [variables, build-docker]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
      IMAGE_NAME: ${{ needs.variables.outputs.image_name }}
      GHCR_IMAGE: ${{ needs.variables.outputs.ghcr_image }}
      VERSION: ${{ needs.variables.outputs.version }}
    if: ${{github.event_name == 'release' || (github.event_name == 'push' && contains(fromJSON(vars.PACKAGE_BRANCHES), github.ref_name))}}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to the Docker github container registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Docker container registry
        if: ${{github.event_name == 'release'}}
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ github.event_name == 'release' && env.IMAGE_NAME || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ env.VERSION }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ env.REF_NAME }},enable=${{ github.event_name != 'release' }}

      # Downloads one file per build-docker leg, named after that leg's image
      # digest (see "Export digest" in build-docker). Combining by digest
      # rather than by the mutable per-arch tags (:REF_NAME-amd64 etc.) means
      # this job always assembles exactly the images this workflow run built,
      # immune to a slower/older run's push landing after this one's.
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push multi-arch manifest
        run: |
          set -eux

          cd /tmp/digests
          ghcr_refs=()
          for digest in *; do
            ghcr_refs+=("${{ env.GHCR_IMAGE }}@sha256:$digest")
          done

          if [ "${{ github.event_name }}" == "release" ]; then
            dockerhub_refs=()
            for digest in *; do
              dockerhub_refs+=("${{ env.IMAGE_NAME }}@sha256:$digest")
            done

            # Create latest tag
            docker buildx imagetools create \
              -t ${{ env.GHCR_IMAGE }}:latest \
              "${ghcr_refs[@]}"

            docker buildx imagetools create \
              -t ${{ env.IMAGE_NAME }}:latest \
              "${dockerhub_refs[@]}"

            # Create version tag
            docker buildx imagetools create \
              -t ${{ env.GHCR_IMAGE }}:${{ env.VERSION }} \
              "${ghcr_refs[@]}"

            docker buildx imagetools create \
              -t ${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
              "${dockerhub_refs[@]}"
          else
            docker buildx imagetools create \
              -t ${{ env.GHCR_IMAGE }}:${{ env.REF_NAME }} \
              "${ghcr_refs[@]}"
          fi